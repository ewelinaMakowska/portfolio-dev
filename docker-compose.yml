version: "3.9"

services:
  app:
    container_name: next-app-dev
    build:
      context: .
      target: development
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    ports:
      - "3000:3000"
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
